name: Publier Cercle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # 24.04 ships the Android SDK; ubuntu-latest moves to 26 from October 2026
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests (logique, analyseurs, serveur MCP)
        run: npm test

      - name: Fichiers web (polices, librairies, numéro de version)
        run: |
          npm run vendor
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}/" www/sw.js

      - name: Publier la PWA sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK Android
        run: |
          set -o pipefail
          # use the SDK preinstalled on the runner, install command-line tools only if it is missing
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/platforms" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -3 | tee -a build.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Compiler l'APK Android
        run: |
          set -o pipefail
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../cercle.apk

      - name: Mettre l'APK en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cercle 1.0.${{ github.run_number }}
          make_latest: true
          files: cercle.apk
          body: |
            Télécharge **cercle.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Chaque nouvelle version s'installe par-dessus la précédente : tes données sont conservées.

      - name: Garder le journal de compilation en cas d'échec
        if: failure()
        run: |
          [ -f build.log ] || echo "pas de journal Gradle (échec avant la compilation)" > build.log
          cp build.log /tmp/build.log
          git config user.name "cercle-ci"
          git config user.email "cercle-ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . -q
          tail -n 400 /tmp/build.log > build.log
          git add build.log
          git commit -q -m "Journal de compilation ${GITHUB_RUN_NUMBER}"
          git push -f origin ci-logs
